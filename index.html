<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>化学和射击 · 游戏中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; background: linear-gradient(160deg, #0b0f14, #131c26);
      color: #e8f2ff; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .wrap { max-width: 960px; width: 100%; }
    h1 { text-align: center; font-size: clamp(28px, 4vw, 44px); letter-spacing: 4px; margin-bottom: 8px;
      color: #eaf4ff; text-shadow: 0 2px 14px rgba(60,180,255,0.35); }
    .subtitle { text-align: center; color: #9fc3e8; font-size: clamp(13px, 1.5vw, 16px); margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .game-card { background: rgba(18,24,32,0.9); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 26px 24px; text-align: center; text-decoration: none; color: #eaf2ff;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; cursor: pointer; display: block; }
    .game-card:hover { transform: translateY(-4px); border-color: #6fdf8f;
      box-shadow: 0 8px 28px rgba(80,255,140,0.2); }
    .game-card .icon { font-size: 46px; margin-bottom: 12px; }
    .game-card .name { font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
    .game-card .desc { font-size: 13px; color: #9fc3e8; line-height: 1.6; }
    .game-card .tag { display: inline-block; margin-top: 12px; font-size: 12px; color: #7dff9a;
      border: 1px solid rgba(120,255,160,0.4); border-radius: 20px; padding: 3px 12px; }
    footer { margin-top: 40px; text-align: center; color: #6f8aa8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>化学和射击 · 游戏中心</h1>
    <div class="subtitle">选择一款游戏开始游玩 · 持续更新中</div>
    <div class="grid">
      <a class="game-card" href="chem-shoot/index.html">
        <div class="icon">⚗️</div>
        <div class="name">化学和射击</div>
        <div class="desc">搜打撤 3D 撤离射击 + 高一化学答题<br/>年级选择 · 排位 · 答题反馈</div>
        <span class="tag">v3.5 · 点击进入</span>
      </a>
    </div>
    <footer>化学和射击 · Game Center — 公测中，欢迎反馈</footer>
  </div>
</body>
</html>
