<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 赋能化学游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; background: linear-gradient(160deg, #eef3f6, #dde7f0);
      color: #2a3a4a; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .wrap { max-width: 960px; width: 100%; }
    h1 { text-align: center; font-size: clamp(28px, 4vw, 44px); letter-spacing: 4px; margin-bottom: 8px;
      color: #1d3247; text-shadow: 0 2px 8px rgba(60,180,255,0.18); }
    .subtitle { text-align: center; color: #5a7086; font-size: clamp(13px, 1.5vw, 16px); margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .game-card { background: rgba(255,255,255,0.9); border: 1px solid rgba(30,60,90,0.14);
      border-radius: 16px; padding: 26px 24px; text-align: center; text-decoration: none; color: #2a3a4a;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; cursor: pointer; display: block; }
    .game-card:hover { transform: translateY(-4px); border-color: #6fdf8f;
      box-shadow: 0 8px 22px rgba(30,60,90,0.16); }
    .game-card .icon { font-size: 46px; margin-bottom: 12px; }
    .game-card .name { font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
    .game-card .desc { font-size: 13px; color: #5a7086; line-height: 1.6; }
    .game-card .tag { display: inline-block; margin-top: 12px; font-size: 12px; color: #2f8f5f;
      border: 1px solid rgba(60,180,110,0.5); border-radius: 20px; padding: 3px 12px; }
    footer { margin-top: 40px; text-align: center; color: #7a8a9a; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 赋能化学游戏</h1>
    <div class="subtitle">选择一款游戏开始游玩 · 持续更新中</div>
    <div class="grid">
      <a class="game-card" href="chem-shoot/index.html">
        <div class="icon">⚗️</div>
        <div class="name">星际机器人</div>
        <div class="desc">星际搜打撤 · 净化哨兵 · 化学答题<br/>年级选择 · 排位 · 答题反馈</div>
        <span class="tag">v4.0 · 点击进入</span>
      </a>
    </div>
    <footer>AI 赋能化学游戏 · Game Center — 公测中，欢迎反馈</footer>
  </div>
</body>
</html>
